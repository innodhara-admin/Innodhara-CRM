<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Read only by the proposal PDF converter (its private HOME).
     Where a template names a font the server does not have, use what Word
     uses on a machine without it, measured 13 Oct 2026. -->
<fontconfig>
  <alias binding="same">
    <family>Russo One</family>
    <accept><family>Carlito</family></accept>
  </alias>
</fontconfig>
