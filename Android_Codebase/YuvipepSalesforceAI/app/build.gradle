plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
}

// Semantic versioning; versionCode = days since epoch (02_ARCHITECTURE §8).
def epochDays = (int) (System.currentTimeMillis() / 86400000L)

android {
    namespace 'com.yuvipep.app'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.yuvipep.app"
        minSdk 26
        targetSdk 35
        versionCode epochDays
        // 0.7.4 carries the Round 7 fixing phase (tranches 1-3). App-side that is
        // F39 (recorder pause / mic behind "Paused"), F51's action chips, F53's
        // Overdue bucket, F36's server chip, F48's demo refusal wording, F58's
        // notification routing, and F38's card-scan flow inversion.
        // 0.8.0 adds Jarvis voice mode (WS /assistant/voice, with the one-clip
        // HTTP turn as fallback) and the live client-draft card.
        versionName "0.8.0-voice"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Default backend base URL. Overridable at runtime via the
        // Environment sheet (tap the `server:` chip, or long-press the logo,
        // on Splash/Login — DEBUG BUILDS ONLY).
        //
        // ⚠ Tunnel URLs rotate whenever the tunnel process restarts. Baking
        // one in only buys a zero-typing first launch for the life of THAT
        // tunnel; once it rotates, the runtime override (Environment sheet)
        // is the only way back. Re-run the tunnel, take the printed URL,
        // paste it here, and rebuild — or just send the new link to whoever
        // has the APK.
        // Set 2026-08-28 to the ngrok tunnel (backend on PORT=9010).
        buildConfigField "String", "DEFAULT_BASE_URL",
                '"https://noninfluential-lamonica-unobservantly.ngrok-free.dev"'
        buildConfigField "String", "EMULATOR_BASE_URL", '"http://10.0.2.2:8000"'
    }

    flavorDimensions = ["audience"]
    productFlavors {
        org {
            dimension "audience"
            // The normal app for organisation staff.
        }
        platform {
            dimension "audience"
            // Super Admin console (Phase 7). Separate launcher identity.
            applicationIdSuffix ".platform"
            versionNameSuffix "-platform"
        }
    }

    buildTypes {
        debug {
            // Local dev servers (http://10.0.2.2:8000) need cleartext.
            manifestPlaceholders = [cleartextPermitted: "true"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // This app talks to a SELF-HOSTED backend whose address the user
            // supplies at runtime. That address is often a plain-http LAN IP
            // (http://192.168.x.x:9010) during a local demo. Refusing cleartext
            // in release made those addresses unreachable with no diagnostic —
            // the request simply failed. HTTPS tunnel URLs are unaffected
            // either way; this only removes a wall in front of the http case.
            manifestPlaceholders = [cleartextPermitted: "true"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.swiperefreshlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata

    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging
    implementation libs.gson

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    implementation libs.hilt.android
    annotationProcessor libs.hilt.compiler

    implementation libs.security.crypto
    implementation libs.lottie
    implementation libs.work.runtime
    implementation libs.markwon.core

    // Jarvis's talking avatar in voice mode: the Duix Mobile SDK (4.1.1),
    // built from github.com/duixcom/Duix-Mobile as an AAR (arm64-v8a and
    // armeabi-v7a only — other ABIs fall back to the voice-only screen).
    // duix.com Community License: see src/main/assets/licenses/.
    implementation files('libs/duix-sdk-4.1.1.aar')

    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view

    testImplementation libs.junit
    testImplementation libs.mockwebserver
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
